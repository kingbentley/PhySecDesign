name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  site-studio:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: site-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site-studio/package-lock.json
      - name: Install from the lock file
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Type check
        run: npm run typecheck
      - name: Server tests in the Workers runtime
        run: npm run test:server
      - name: Build
        run: npm run build
      - name: Sites package test
        run: npm run test:sites
      - name: Self-hosted smoke test
        run: npm run smoke:selfhost

  browser:
    # Playwright in desktop Chromium and in WebKit with an iPhone profile, with axe (K24, story 1.2).
    # Each project's server gets a set-up code generated for the run; none is stored in the repository.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: site-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site-studio/package-lock.json
      - name: Install from the lock file
        run: npm ci
      - name: Install the browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Browser tests (build, then Chromium and WebKit iPhone)
        run: npm run test:browser
      - name: Keep the traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: |
            site-studio/test-results/
            site-studio/playwright-report/
          retention-days: 14
