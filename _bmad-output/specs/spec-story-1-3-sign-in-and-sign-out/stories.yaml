- id: "1"
  title: Sign-in data, rules and storage
  description: >-
    Shared sign-in rules and limits, session tokens and the marker, the random stand-in hash and
    the hash queue, and the installation object's session, failure-count and ticket tables and
    operations. Covers the storage side of CAP-3, CAP-6, CAP-7, CAP-8, CAP-11 and the D-5 queue in
    SPEC.md.
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    Build to Kevin's decisions D-1 to D-5 and the applied review findings in SPEC.md. Do not start
    until Kevin has ruled on the held findings H-1 to H-9 and the spec is marked ready for
    development. No routes, pages or deploys in this spec.
- id: "2"
  title: Sign-in routes, cookies and services
  description: >-
    The session read, sign-in and sign-out routes, cookie lists in handler replies, the origin rule
    and its declaration sweep, the timing test, the deploy/probe fixture and the self-hosted smoke
    test. Covers CAP-2, CAP-5, CAP-9, the cookie side of CAP-3, CAP-6's timing test, the local parts
    of CAP-10 and CAP-13, and the server side of CAP-1 in SPEC.md.
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    Writes are never retried after a bare reset (story 1.2's D-2 as amended). The fixture and probe
    follow D-6 and the applied findings A-22 and V-3; no deploy in this spec. Rows marked held wait
    for Kevin's rulings.
- id: "3"
  title: Sign-in page, account menu and browser tests
  description: >-
    The S-26 sign-in page, the start-up flow, the account menu in the existing header, the change
    to the set-up done page, and Playwright and axe tests in Chromium and WebKit iPhone on their own
    server pairs, including two local installations on one host with different ports. Covers CAP-1,
    CAP-4, CAP-14 and the on-screen parts of CAP-5, CAP-7, CAP-8, CAP-10 and CAP-11 in SPEC.md.
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    Build to D-7 to D-10 in SPEC.md. Check first whether both browsers keep the real __Host-
    session cookie on http://127.0.0.1, and serve the local test servers over HTTPS if not (D-10).
    No manual-only page check (standing rule 15).
- id: "4"
  title: Acceptance on Cloudflare
  description: >-
    Deploy two test Workers from one build, with different administrator emails, and the
    deploy/probe Worker, and run the deployed checks in order: CAP-10 across Workers, CAP-12 (R9,
    CA-08 median, 25 simultaneous wrong sign-ins with and without a marker), CAP-13's Cloudflare
    part and the deployed cookie attributes; record the results.
  spec_checkpoint: false
  done_checkpoint: true
  invoke_dev_with: >-
    Deploy only to the 'PhySec Site Studio' test account, from Kevin's workstation if the session's
    network cannot reach it (story 1.2 spec 4); delete extra Workers and the probe afterwards.
