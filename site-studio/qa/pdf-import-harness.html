<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PhySec PDF import QA</title>
  <style>
    body { min-width: 0 !important; padding: 24px; }
    .qa-pdf-harness { max-width: 900px; margin: 45px auto; }
    .qa-pdf-harness h1 { font-size: 28px; margin-bottom: 12px; }
    .qa-pdf-harness p { line-height: 1.7; margin-bottom: 18px; color: #62796d; }
    .qa-fixture-buttons { display: flex; flex-wrap: wrap; gap: 10px; margin: 24px 0; }
    .qa-fixture-note { font-size: 12px; }
    .qa-import-result { padding: 18px; border: 1px solid #dce5df; background: #fff; border-radius: 8px; margin-top: 22px; }
    .qa-import-result h2 { font-size: 15px; margin-bottom: 12px; }
    .qa-import-result pre { font-size: 12px; line-height: 1.65; white-space: pre-wrap; overflow-wrap: anywhere; }
    .qa-status { min-height: 25px; font-size: 13px; color: #007e73; }
  </style>
</head>
<body>
  <div id="qa-root"></div>
  <script type="module" src="./pdf-import-harness.jsx"></script>
</body>
</html>
